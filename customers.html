<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VendorHub</title>
    
        <link rel="stylesheet" href="style.css">
    
    
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

<div class="dashboard">

 <!-- Sidebar -->

<div class="sidebar">

    <div class="logo">

        <i class="fas fa-store"></i>

        <h2>VendorHub</h2>

        <p>Inventory Management</p>

    </div>

    <a href="dashboard.html">
        <i class="fas fa-house"></i>
        Dashboard
    </a>

    <a href="products.html">
        <i class="fas fa-box"></i>
        Products
    </a>

    <a href="customers.html" class="active">
        <i class="fas fa-users"></i>
        Customers
    </a>

    <a href="sales.html">
        <i class="fas fa-cart-shopping"></i>
        Sales
    </a>

    <a href="inventory.html">
        <i class="fas fa-warehouse"></i>
        Inventory
    </a>

    <a href="reports.html">
        <i class="fas fa-chart-line"></i>
        Reports
    </a>

</div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="container">

            <div class="header">

                <div>
                    <h1>Customers</h1>
                    <p>Manage your customers and their information.</p>
                </div>

                <div>
                    <button id="addCustomerBtn">
                        + Add Customer
                    </button>
                </div>

            </div>

            <!-- Customer Form -->

            <div id="customerForm" class="card" style="display:none;">

                <h2>Add Customer</h2>

                <br>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Customer Name">

                <input
                    type="text"
                    id="customerPhone"
                    placeholder="Phone Number">

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="Email Address">

                <input
                    type="text"
                    id="customerAddress"
                    placeholder="Address">

                <br><br>

                <button id="saveCustomerBtn">
                    Save Customer
                </button>

            </div>

            <br>

            <!-- Customer Table -->

            <div class="card">

                <h2>Customer List</h2>

                <br>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="customerTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<footer>

    VendorHub Inventory System

    <br><br>

    Developed by Brown © 2026

</footer>

<script src="js/customers.js"></script>

</body>
</html>
