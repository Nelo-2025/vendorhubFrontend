<!DOCTYPE html>
<html lang="en">
 <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VendorHub</title>
    
        <link rel="stylesheet" href="style.css">
    
        <!-- Font Awesome -->
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    </head>

<body>

<div class="dashboard">

   <!-- Sidebar -->

<div class="sidebar">

    <div class="logo">

        <i class="fas fa-store"></i>

        <h2>VendorHub</h2>

        <p>Inventory Management</p>

    </div>

    <a href="dashboard.html">
        <i class="fas fa-house"></i>
        Dashboard
    </a>

    <a href="products.html">
        <i class="fas fa-box"></i>
        Products
    </a>

    <a href="customers.html">
        <i class="fas fa-users"></i>
        Customers
    </a>

    <a href="sales.html" class="active">
        <i class="fas fa-cart-shopping"></i>
        Sales
    </a>

    <a href="inventory.html">
        <i class="fas fa-warehouse"></i>
        Inventory
    </a>

    <a href="reports.html">
        <i class="fas fa-chart-line"></i>
        Reports
    </a>

</div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="container">

            <div class="header">

                <div>
                    <h1>Sales Management</h1>
                    <p>Create sales and monitor recent transactions.</p>
                </div>

                <div>
                    <h2 id="salesCount">0</h2>
                </div>

            </div>

            <!-- Sale Form -->

            <div class="card">

                <h2>New Sale</h2>

                <br>

                <label>Customer</label>
                <select id="customer"></select>

                <label>Product</label>
                <select id="product"></select>

                <label>Quantity</label>
                <input type="number" id="quantity" value="1" min="1">

                <label>Price (₦)</label>
                <input type="text" id="price" readonly>

                <label>Total (₦)</label>
                <input type="text" id="total" readonly>

                <br><br>

                <button id="saveSaleBtn">
                    Record Sale
                </button>

            </div>

            <br>

            <!-- Recent Sales -->

            <div class="card">

                <h2>Recent Sales</h2>

                <br>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Customer</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="salesTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<footer>

    VendorHub Inventory System

    <br><br>

    Developed by Brown © 2026

</footer>

<script src="js/sales.js"></script>

</body>
</html>
