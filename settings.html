<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | VendorHub</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">

                <div class="logo">
            <img class="brand-mark" src="assets/logo.png" alt="VendorHub logo" width="44" height="44">
            <div class="brand-text">
                <h2>VendorHub</h2>
                <p>Inventory</p>
            </div>
        </div>

        <a href="dashboard.html">
            <i class="fas fa-house"></i>
            Dashboard
        </a>

        <a href="products.html">
            <i class="fas fa-box"></i>
            Products
        </a>

        <a href="customers.html">
            <i class="fas fa-users"></i>
            Customers
        </a>

        <a href="sales.html">
            <i class="fas fa-cart-shopping"></i>
            Sales
        </a>

        <a href="inventory.html">
            <i class="fas fa-warehouse"></i>
            Inventory
        </a>

        <a href="reports.html">
            <i class="fas fa-chart-line"></i>
            Reports
        </a>

        <a href="settings.html" class="active">
            <i class="fas fa-gear"></i>
            Settings
        </a>

        <a href="#" class="logout-link" onclick="logoutUser(); return false;">
            <i class="fas fa-right-from-bracket"></i>
            Logout
        </a>

    </div>

    <div class="main-content">
        <div class="container">

            <div class="header">
                <h1>Settings</h1>
                <p>Welcome, <strong id="userName">User</strong></p>
            </div>

            <div class="card">
                <h3>Profile</h3>
                <br>

                <form id="profileForm">

                    <label for="profileName">Name</label>
                    <input type="text" id="profileName" name="name" required>

                    <label for="profileEmail">Email</label>
                    <input type="email" id="profileEmail" readonly>

                    <p id="profileMessage" class="auth-message"></p>

                    <button type="submit">Save name</button>

                </form>
            </div>

            <br>

            <div class="card">
                <h3>Session</h3>
                <p>You are signed in to VendorHub.</p>
                <button type="button" onclick="logoutUser()">Logout</button>
            </div>

        </div>
    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/settings.js"></script>

</body>
</html>
