<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
            <header>
                <div class="nav-inner">
                    <a class="logo" href="index.html"><span class="dot"></span>Nearby</a>
                    <div class="nav-actions">
                        <a href="register.html" class="btn btn-ghost">Sign up</a>
                    </div>
                </div>
            </header>

            <main class="auth-shell">
                <h1>Login</h1>
                <p>Access your account with your email and password.</p>

                <form id="login-form" novalidate>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>

                    <div class="inline-row">
                        <label for="password">Password</label>
                        <a class="link" href="forgot-password.html">Forgot password?</a>
                    </div>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-toggle-password="password">Show</button>
                    </div>

                    <button type="submit">Login</button>
                    <div id="login-message" class="notice hidden" role="status"></div>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Register here</a>.
                </div>
            </main>

            <script src="js/login.js"></script>
</body>
</html>
