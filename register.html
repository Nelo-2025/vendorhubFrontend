<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

            <header>
                <div class="nav-inner">
                    <a class="logo" href="index.html"><span class="dot"></span>Nearby</a>
                    <div class="nav-actions">
                        <a href="login.html" class="btn btn-ghost">Log in</a>
                    </div>
                </div>
            </header>

            <main class="auth-shell">
                <h1>Create Account</h1>
                <p>Set up your account with a valid email address.</p>

                <form id="register-form" novalidate>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>

                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" data-toggle-password="password">Show</button>
                    </div>

                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" data-toggle-password="confirm-password">Show</button>
                    </div>

                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="">Select a role</option>
                        <option value="attendee">Attendee</option>
                        <option value="organizer">Organizer</option>
                        <option value="admin">Admin</option>
                    </select>

                    <button type="submit">Register</button>
                    <div id="register-message" class="notice hidden" role="status"></div>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in here</a>.
                </div>
            </main>

            <script src="js/register.js"></script> 


</body>
</html>
