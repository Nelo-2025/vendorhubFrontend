<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VendorHub</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body class="auth-page">

    <div class="auth-card">

                <div class="auth-brand">
            <img class="brand-mark" src="assets/logo.png" alt="VendorHub logo" width="56" height="56">
            <h1>VendorHub</h1>
            <p>Create your account</p>
        </div>

        <form id="registerForm">

            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" minlength="6" required>
                <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <p id="authMessage" class="auth-message"></p>

            <button type="submit">Register</button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
