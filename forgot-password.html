<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="logo" href="index.html"><span class="dot"></span>Nearby</a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost">Back to login</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <h1>Reset password</h1>
    <p>Verify your email, then enter the code to choose a new password.</p>

    <form id="forgot-password-form" novalidate>
      <label for="reset-email">Email</label>
      <input type="email" id="reset-email" autocomplete="email" required>
      <button type="submit">Send verification code</button>
    </form>

    <form id="verify-code-form" class="hidden" novalidate>
      <label for="verification-code">Verification code</label>
      <input type="text" id="verification-code" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
      <button type="submit">Verify code</button>
    </form>

    <form id="reset-password-form" class="hidden" novalidate>
      <label for="new-password">New password</label>
      <div class="password-field">
        <input type="password" id="new-password" autocomplete="new-password" required>
        <button type="button" class="password-toggle" data-toggle-password="new-password">Show</button>
      </div>
      <button type="submit">Update password</button>
    </form>

    <div id="forgot-message" class="notice hidden" role="status"></div>
    <div id="forgot-success" class="success-box hidden" role="status"></div>
  </main>

  <script src="js/forgot-password.js"></script>
</body>
</html>
